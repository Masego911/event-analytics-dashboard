spring.application.name=eventpulse-backend

server.port=8080

# ------------------------------------------------------------
# Database
# ------------------------------------------------------------
#
# Database auto-configuration is intentionally excluded during
# the first migration step.
#
# SQL Server will be introduced once the first domain entities,
# repositories and migration scripts are ready.

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
